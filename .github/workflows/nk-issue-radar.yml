# 북한·통일 실시간 이슈 레이더
#
# 왜 자주 도는가: 통일부 공공데이터는 **전부 과거**다(33종 중 26종이 이미 멈춘 자료).
#   현재가 없다. 뉴스 레이더가 그 반대편을 채운다 —
#   뉴스는 근거가 아니라 **검증 대상**이므로(CLAUDE.md §3a) 코퍼스에 섞지 않고
#   '지금 도는 주장'으로만 보여주고, 누르면 우리 공식자료로 되묻는 입구가 된다.
#
# 창과 주기를 왜 다르게 두는가 (실측 2026-08-13):
#     최근 1시간  고유    1건 → 군집 불가
#     최근 3시간  고유   44건 → 2건 이상 군집 2개
#     최근 24시간 고유 1,484건 → 2건 이상 군집 79개
#   같은 사건이 여러 매체로 퍼지는 데 몇 시간 걸린다. 창을 좁히면 이슈가 안 만들어진다.
#   → **창은 24시간(군집), 속보는 3시간(원문), 실시간성은 갱신 주기가 만든다.**
#
# 비용: 1회 약 130콜. 30분 주기면 하루 약 6,200콜.
#   Naver API Hub 무료 한도를 넘기지 않도록 주기를 늘리려면 cron 만 바꾸면 된다.
#
# 필요한 저장소 시크릿
#   NCP_ID / NCP_SECRET        ← api.txt 의 같은 이름 (네이버 API Hub 검색)
#   GEMINI_API_KEYS            ← 리랭커용. 없으면 규칙 결과 그대로 나간다(정밀도 ~50%)
#   ⚠ api.txt 는 gitignore 다. 값은 GitHub Secrets 에만 넣는다.

name: nk-issue-radar

on:
  schedule:
    - cron: '*/30 * * * *'     # 30분마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nk-issue-radar
  cancel-in-progress: true      # 앞 실행이 밀리면 버린다 — 최신 한 번이면 충분하다

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 이슈 수집
        env:
          NCP_ID: ${{ secrets.NCP_ID }}
          NCP_SECRET: ${{ secrets.NCP_SECRET }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          if [ -z "$NCP_ID" ] || [ -z "$NCP_SECRET" ]; then
            echo "::error::시크릿 NCP_ID / NCP_SECRET 이 없습니다 (값은 api.txt 에 있습니다)."
            exit 1
          fi
          node scripts/nk-issue-radar.mjs 24 12

      - name: 웹 자산에 반영
        run: |
          # 인덱스 전체를 다시 만들 필요는 없다 — 이슈 파일만 복사한다.
          cp 북한자료-api/nk-issues.json frontend/public/nk-issues.json

      - name: 변경분만 커밋
        run: |
          if git diff --quiet -- frontend/public/nk-issues.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/nk-issues.json 북한자료-api/nk-issues.json
          git commit -m "chore: 실시간 이슈 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
          # 30분마다 도는 작업이라 원격이 앞서 있을 수 있다 — rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "::error::푸시 실패"
          exit 1
