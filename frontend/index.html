<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>사실은ON | 국민이 묻고 국가 공식자료가 답하는 북한·통일 팩트체커</title>

    <!-- ── 본문 명조 (기억 카드 전용) ──
         Noto Serif KR = Adobe 본명조(Source Han Serif) 한국어 컷 · SIL OFL 1.1.
         기억 카드에서 **사람이 남긴 말**만 이 글꼴로 찍는다(고딕은 시스템 글꼴 그대로).

         · wght 를 `200..900` **범위**로 요청한다. `wght@400;700` 처럼 낱개로 적으면
           Google 이 정적 인스턴스를 줄 수 있어 내려받는 파일 수가 두 배가 된다.
         · display=swap — 느린 회선에서 빈 화면을 보이지 않는다. 고령 사용자가 주 사용자다.
         · ★ &text= 파라미터를 **절대** 붙이지 마라. 그 순간 사용자가 적은 문장이
           URL 에 실려 fonts.googleapis.com 으로 나간다 —
           "적으신 내용은 이 기기 밖으로 나가지 않습니다"가 거짓말이 된다.
         · 나중에 CSP 를 넣는다면 style-src 에 https://fonts.googleapis.com,
           font-src 에 https://fonts.gstatic.com 을 반드시 함께 넣어야 한다.
           빠뜨리면 로컬에서는 되고 배포본에서만 조용히 고딕이 된다.
         · 이 링크가 막혀도 카드는 그대로 나온다 — 시스템 명조(함초롬바탕·바탕·
           AppleMyungjo)로 떨어지고, 그것도 없으면 고딕으로 착지한다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap"
    />
    <style>
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif; color: #0f172a;
        background: #ffffff;
      }
      #boot .logo { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; }
      #boot .tag { font-size: 13px; color: #64748b; max-width: 320px; text-align: center; }
      #boot .spin {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #e2e8f0; border-top-color: #0f172a;
        animation: factdoc-spin 0.8s linear infinite;
      }
      @keyframes factdoc-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #boot { background: #020617; color: #f8fafc; }
        #boot .tag { color: #94a3b8; }
        #boot .spin { border-color: #1e293b; border-top-color: #f8fafc; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="spin"></div>
        <div class="logo">사실은<span style="color:#2563eb">ON</span></div>
        <div class="tag">통일부 공공데이터를 불러오는 중…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
